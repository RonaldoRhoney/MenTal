name: mental
description: MENTAL — cliente Flutter (Vertical Slice 01)
publish_to: "none"
version: 0.2.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  http: ^1.2.0
  uuid: ^4.4.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.2.1
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  sound_mode_advanced: ^4.0.0
  fl_chart: ^1.2.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  # V3.0.1 — foreground service Android pra manter o listener do sensor
  # de passos vivo com o app em segundo plano/tela apagada (achado real,
  # 29/08/2026: TYPE_STEP_COUNTER só entrega evento com um listener ATIVO
  # no momento do passo — sem isso, passos dados com o app fechado/tela
  # apagada nunca chegam, mesmo reabrindo depois; ver movement_service.dart).
  flutter_foreground_task: ^11.0.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  share_plus: ^13.3.0
  supabase_flutter: ^2.8.0
  # MENTAL-POL-002 §3.1 (24/08/2026): tela de confirmação de maioridade
  # linka Termos de Uso/Política de Privacidade.
  url_launcher: ^6.3.0
  # Upload de foto de perfil real (revisão 27/08/2026, substitui avatar emoji).
  image_picker: ^1.1.2
  crop_your_image: ^2.0.0
  path_provider: ^2.1.6
  # V3.4 (V3/V3.4_LIBRAS.md §5) — player de vídeo embutido para os
  # vídeos institucionais de referência (INES/VLibras/UFSC). Escolhido
  # youtube_player_iframe em vez do youtube_player_flutter (mais antigo,
  # baseado em PlatformView nativo): iframe usa webview_flutter por
  # baixo, é o sucessor mantido pela mesma equipe (pod_learning), com
  # suporte mais atual e melhor compatibilidade entre plataformas.
  youtube_player_iframe: ^5.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#111013"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/
