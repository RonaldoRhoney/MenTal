<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1024px; height:500px; overflow:hidden; }
  .banner {
    width:1024px; height:500px;
    background: radial-gradient(ellipse at 75% 30%, rgba(226,190,110,0.14) 0%, transparent 55%),
                linear-gradient(135deg, #111013 0%, #16151a 60%, #111013 100%);
    position:relative;
    display:flex;
    align-items:center;
    font-family:'Segoe UI', system-ui, sans-serif;
  }
  .synapse {
    position:absolute;
    right:60px; top:50%;
    transform:translateY(-50%);
    width:380px; height:380px;
    opacity:0.95;
  }
  .content {
    position:relative;
    z-index:2;
    padding-left:70px;
    max-width:520px;
  }
  .wordmark {
    font-family: Georgia, 'Fraunces', serif;
    font-size:76px;
    font-weight:700;
    color:#E2BE6E;
    letter-spacing:2px;
    line-height:1;
    margin-bottom:18px;
  }
  .slogan {
    font-size:26px;
    color:#EDE7DA;
    font-weight:400;
    line-height:1.4;
    max-width:460px;
  }
  .tag {
    display:inline-block;
    margin-top:26px;
    padding:8px 20px;
    border:1px solid rgba(63,167,150,0.5);
    border-radius:30px;
    color:#3FA796;
    font-size:15px;
    letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div class="banner">
  <svg class="synapse" viewBox="0 0 100 100">
    <defs>
      <radialGradient id="glowF" cx="50%" cy="46%" r="62%">
        <stop offset="0%" stop-color="#E2BE6E" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#E2BE6E" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="50" cy="47" r="40" fill="url(#glowF)"/>
    <path d="M50 15 C33 15, 19 27, 19 45 C19 57, 26 65, 34 70 L34 81 L66 81 L66 70 C74 65, 81 57, 81 45 C81 27, 67 15, 50 15 Z"
          fill="none" stroke="#3A3560" stroke-width="1" opacity="0.4"/>
    <path d="M28 68 L36 58 L44 62 L50 47" fill="none" stroke="#3FA796" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="28" cy="68" r="2.2" fill="#3FA796"/>
    <circle cx="36" cy="58" r="2.2" fill="#3FA796"/>
    <circle cx="44" cy="62" r="2.2" fill="#3FA796"/>
    <line x1="33" y1="33" x2="50" y2="47" stroke="#E2BE6E" stroke-width="2.3"/>
    <line x1="50" y1="47" x2="69" y2="37" stroke="#E2BE6E" stroke-width="2.3"/>
    <line x1="50" y1="47" x2="63" y2="62" stroke="#3FA796" stroke-width="2.3"/>
    <line x1="33" y1="33" x2="28" y2="49" stroke="#E2BE6E" stroke-width="1.5" opacity="0.75"/>
    <line x1="69" y1="37" x2="72" y2="54" stroke="#3FA796" stroke-width="1.5" opacity="0.75"/>
    <circle cx="50" cy="47" r="9.5" fill="none" stroke="#E2BE6E" stroke-width="1" opacity="0.4"/>
    <circle cx="50" cy="47" r="6" fill="#E2BE6E"/>
    <path d="M47 44 L50 40 L53 44" fill="none" stroke="#111013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="33" r="4" fill="#E2BE6E"/>
    <circle cx="69" cy="37" r="4" fill="#3FA796"/>
    <circle cx="63" cy="62" r="4" fill="#E2BE6E"/>
    <circle cx="28" cy="49" r="2.6" fill="#E2BE6E"/>
    <circle cx="72" cy="54" r="2.6" fill="#3FA796"/>
  </svg>
  <div class="content">
    <div class="wordmark">MENTAL</div>
    <div class="slogan">Mental é quem conquista com a mente.</div>
    <div class="tag">DESAFIOS DIÁRIOS · CONQUISTE TERRITÓRIOS</div>
  </div>
</div>
</body>
</html>
